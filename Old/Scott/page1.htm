<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

<html>
<head>
	<title>Scott's first (assisted) web page</title>
</head>

<body>
    <!-- This is a comment and will not be seen -->
    <!-- Starting comment tag
    Note we can make comments
    go over multiple lines
    This is the ending tag --> 
    <!-- a link is used as follows -->
    This is a <a href='hello.htm' target='_blank'>link</a>
    <br> <!-- This is a carraige return -->
    This is a picture: <img src='images/info.gif' width='20' height='20'>
    <br>
    <!-- Lets add some Javascript to spice things up -->
    <a href="javascript:location.reload()" target="_self">Refresh</a>
    <br>
    <!-- An interesting 'feature': 
    If a tag isn't understood, it, and anything it describes is ignored.. For example:  -->
    <ximg src='images/info.gif' width='20' height='20'>
    <!-- The above line looks almost identical to line 17, except for the 'x' in ximg
    The end result is that we have preserved a line of code (for future use maybe?) -->
    
    <!-- Headings use the H prefix  -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h6>Heading 6</h6>
    Underlines... <u>Underlined</u>  <!-- Deprecated (obsolete) tag  -->
    <style:text_size='6'>Underlines...</style>
    <br>
    Bold... <b>Bold</b>  <!-- Deprecated (obsolete) tag  -->
    <br>
    Bold... <strong>Bold</strong>
    <br>
    Italics... <i>Italics</i>  <!-- Deprecated (obsolete) tag  -->
    <br>
    Italics... <em>Italics</em>
    <br>
    Mix and Match... <em><strong><u><h2>Test</h2></u></strong></em>
    <br>
    <br>
    <!-- The div tag divides your page into sections, each with its own formatting -->
    <div align='center'>
        Tables
        <table border='1'>
            <tr> <!-- Table row -->
                <td>Table data</td>  <!-- Think of a td as a column -->
                <td>More data, same row</td>
            </tr>
            <tr>
                <td>Row 2</td>
                <td>&nbsp;</td>  <!-- No data, but have to put something in, so insert a 
                                      non breaking space                                 -->            
            </tr>
            <tr>
                <td colspan='2'>No data for second column</td>
            </tr>
        </table>
    </div>
</body>
</html>
