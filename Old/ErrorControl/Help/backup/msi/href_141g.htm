<H1><A NAME="_msi_visible_dialog_style_bit"></A>Visible Dialog Style Bit</H1>

<P>If this bit is set the dialog is originally created as visible, otherwise it is hidden.</P>

<H4>Value</H4>

<TABLE>

<TR VALIGN="top">
<TH align=left width=18%>Decimal</TH>
<TH align=left width=25%>Hexadecimal</TH>
<TH align=left width=57%>Constant</TH>
</TR>

<TR VALIGN="top">
<TD width=18%>1</TD>
<TD width=25%>0x00000001</TD>
<TD width=57%><B>msidbDialogAttributesVisible</B></TD>
</TR>
</TABLE><BR>
