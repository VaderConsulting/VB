<H1><A NAME="_msi_minimize_dialog_style_bit"></A>Minimize Dialog Style Bit</H1>

<P>If this bit is set, the dialog box can be minimized. This bit is ignored for modal dialog boxes, which cannot be minimized.</P>

<H4>Value</H4>

<TABLE>

<TR VALIGN="top">
<TH align=left width=18%>Decimal</TH>
<TH align=left width=25%>Hexadecimal</TH>
<TH align=left width=57%>Constant</TH>
</TR>

<TR VALIGN="top">
<TD width=18%>4</TD>
<TD width=25%>0x00000004</TD>
<TD width=57%><B>msidbDialogAttributesMinimize</B></TD>
</TR>
</TABLE><BR>
