<H1><A NAME="_msi_title_property"></A>Title Property</H1>

<P>The Title property is a read-only property that returns the title of the feature in the Title column of the <A HREF="tref_0a91.htm">Feature table</A>.</P>

<H4>Syntax</H4>

<P><I>object</I>.Title</P>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="vref_2ud0.htm"><B>FeatureInfo </B>object</A>
</DD>
</DL>
