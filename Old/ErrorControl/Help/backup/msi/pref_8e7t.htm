<H1><A NAME="_msi_mypicturesfolder_property"></A>MyPicturesFolder Property</H1>

<P>Full path to the MyPictures folder. A common path is C:\WINNT\Profiles\username\My Documents\My Pictures. </P>

<H4>Remarks</H4>

<P>This property is not available with Windows Installer version 1.0.</P>
