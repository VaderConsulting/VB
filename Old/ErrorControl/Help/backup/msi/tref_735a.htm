<H1><A NAME="_msi_condition"></A>Condition</H1>

<P>The Condition data type is a text string containing a valid conditional statement that can be evaluated as true or false. For information on the syntax of conditional statements, see <A HREF="novr_1ol4.htm">Conditional Statement Syntax</A>.</P>
