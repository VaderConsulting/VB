<H1><A NAME="_msi_doubleinteger"></A>DoubleInteger</H1>

<P>The DoubleInteger data type is a four-byte integer value. Unless otherwise restricted, the range of legal values is from –2,147,483,647 to +2,147,483,647.</P>
