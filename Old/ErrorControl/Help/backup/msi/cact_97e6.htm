<H2><A NAME="_msi_attempting_to_set_a_restore_point_from_a_custom_action"></A>Attempting to Set a Restore Point from a Custom Action</H2>

<P>Custom actions must not call <B>SRSetRestorePoint</B> because this may result in a restore entry point being written into the middle of a Windows Installer installation. </P>
