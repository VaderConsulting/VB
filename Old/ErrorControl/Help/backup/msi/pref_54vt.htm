<H1><A NAME="_msi_isadminpackage_property"></A>IsAdminPackage Property</H1>

<P>The installer sets the IsAdminPackage property to 1 if the current installation is running from a package created through an <A HREF="over_6jzi.htm">administrative installation</A>.</P>
