<H1><A NAME="_msi_type_property"></A>Type Property</H1>

<P>The read-only Type property returns one of the values of msmErrorType, indicating the type of error represented by this object.</P>

<H4>Syntax</H4>

<PRE class=syntax>object.Type</PRE>
