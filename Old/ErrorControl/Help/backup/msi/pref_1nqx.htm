<H1><A NAME="_msi_tempfolder_property"></A>TempFolder Property</H1>

<P>The installer sets the TempFolder property to the full path to the Temp folder.</P>

<H4>Remarks</H4>

<P>A common value for this property is C:\Temp.</P>
