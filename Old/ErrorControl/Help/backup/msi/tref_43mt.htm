<H1><A NAME="_msi_template"></A>Template</H1>

<P>The Template data type is a text string that may contain properties that are enclosed in brackets <CODE>[ ]</CODE>. The template type allows all of the <A HREF="tref_0qp0.htm">Formatted</A> type formats, plus [<I>1</I>] where <I>1</I> is a number.</P>
