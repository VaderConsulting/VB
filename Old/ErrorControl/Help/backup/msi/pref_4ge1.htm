<H1><A NAME="_msi_commonfilesfolder_property"></A>CommonFilesFolder Property</H1>

<P>The installer sets the CommonFilesFolder property to the full path to the Common Files folder for the current user. </P>

<H4>Remarks</H4>

<P>A common value for this property is C:\Program Files\Common Files\.</P>
