<H1><A NAME="_msi_rightaligned_dialog_style_bit"></A>RightAligned Dialog Style Bit</H1>

<P>If this style bit is set the text is aligned on the right side of the dialog.</P>

<H4>Value</H4>

<TABLE>

<TR VALIGN="top">
<TH align=left width=18%>Decimal</TH>
<TH align=left width=25%>Hexadecimal</TH>
<TH align=left width=57%>Constant</TH>
</TR>

<TR VALIGN="top">
<TD width=18%>256</TD>
<TD width=25%>0x00000100</TD>
<TD width=57%><B>msidbDialogAttributesRightAligne</B></TD>
</TR>
</TABLE><BR>
