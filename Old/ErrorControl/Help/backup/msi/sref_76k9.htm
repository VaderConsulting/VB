<H1><A NAME="_msi_author_summary_property"></A>Author Summary Property</H1>

<P>The Author Summary property conveys to a file browser the manufacturer of the installation database. This value is typically set from the installer property <A HREF="pref_9z09.htm">Manufacturer</A>.</P>
