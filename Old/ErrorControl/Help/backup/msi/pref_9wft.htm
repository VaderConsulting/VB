<H1><A NAME="_msi_arpnorepair_property"></A>ARPNOREPAIR Property</H1>

<P>The ARPNOREPAIR property is set to 1 to disable the Repair button in the Programs Wizard. The Repair button remains enabled for any value not equal to 1.</P>
