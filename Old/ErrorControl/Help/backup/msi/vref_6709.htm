<H1><A NAME="_msi_attributes_property"></A>Attributes Property</H1>

<P>The Attributes property is a read-write property that returns the value for the feature in the Attributes column of the <A HREF="tref_0a91.htm">Feature table</A>.</P>

<H4>Syntax</H4>

<P><I>object</I>.Attributes</P>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="vref_2ud0.htm"><B>FeatureInfo </B>object</A>

</DD>
</DL>
