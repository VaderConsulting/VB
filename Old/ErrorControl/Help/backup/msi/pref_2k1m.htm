<H1><A NAME="_msi_intel_property"></A>Intel Property</H1>

<P>The Intel property is defined only if running on an Intel processor. The value is set by the installer to the numeric processor level, for example 4 for 486, 5 for P5, 6 for P6, etc.</P>
