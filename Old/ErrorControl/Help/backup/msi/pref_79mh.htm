<H1><A NAME="_msi_adminuser_property"></A>AdminUser Property</H1>

<P>The installer sets the AdminUser property on Windows&nbsp;NT/Windows&nbsp;2000 if the user has administrator privileges. This property is always set on Windows 95 and Windows 98.</P>
