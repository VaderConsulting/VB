<H1><A NAME="_msi_installer_property"></A>Installer Property</H1>

<P>The read-only Installer property of the <A HREF="vref_8xis.htm"><B>Session</B> object</A> returns the active <A HREF="vref_6fxw.htm"><B>Installer</B> object</A>.</P>

<H4>Syntax</H4>

<P><I>object</I>.Installer</P>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="vref_8xis.htm"><B>Session</B> object</A></DD>
</DL>
