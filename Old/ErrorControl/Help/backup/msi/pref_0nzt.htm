<H1><A NAME="_msi_arpsystemcomponent_property"></A>ARPSYSTEMCOMPONENT Property</H1>

<P>Setting the ARPSYSTEMCOMPONENT property to 1 using the command line or a transform prevents the application from being displayed in the Add/Remove programs list.</P>
