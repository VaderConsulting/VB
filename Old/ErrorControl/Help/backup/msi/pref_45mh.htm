<H1><A NAME="_msi_alpha_property"></A>Alpha Property</H1>

<P>The Alpha property is defined only if running on an Alpha processor. The installer sets it to the value of the numeric processor level.</P>

<P class=note><B>Note</B>&nbsp;&nbsp;The Alpha platform is not supported by Windows Installer version 1.1.</P>
