<H1><A NAME="_msi_arpinstalllocation_property"></A>ARPINSTALLLOCATION Property</H1>

<P>The ARPINSTALLLOCATION property is the full path to the application's primary folder.</P>

<H4>Remarks</H4>

<P>Typically needs to be set by a custom action.</P>
