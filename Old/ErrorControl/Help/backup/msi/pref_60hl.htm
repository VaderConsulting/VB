<H1><A NAME="_msi_arpcontact_property"></A>ARPCONTACT Property</H1>

<P>The ARPCONTACT property provides the Add/Remove Control Panel Contact that is written under the <A HREF="app_4hix.htm">Uninstall Registry Key</A>. This property can be set by the command line or a transform.</P>
