<H1><A NAME="_msi_arpreadme_property"></A>ARPREADME Property</H1>

<P>The ARPREADME property provides the Add/Remove Control Panel ReadMe for the application that is written under the <A HREF="app_4hix.htm">Uninstall Registry Key</A>. This property can by set by the command line or a transform.</P>
