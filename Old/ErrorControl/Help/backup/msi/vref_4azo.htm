<H1><A NAME="_msi_cleardata_method"></A><A NAME="helpid_msirecord_cleardata"></A>ClearData Method</H1>

<P>The <B>ClearData</B> method of the <A HREF="vref_6kac.htm"><B>Record</B> object</A> clears the data in all fields, setting them to Null. Any objects stored in the fields are released.</P>

<H4>Syntax</H4>

<P><I>object</I>.ClearData</P>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="vref_6kac.htm"><B>Record</B> object</A>
</DD>
</DL>
