<H1><A NAME="_msi_log_method"></A>Log Method</H1>

<P>The <B>Log</B> method writes a text string to the currently open log file. </P>

<H4>Syntax</H4>

<PRE class=syntax>object.Log(Message)</PRE>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="merg_4th0.htm"><B>Merge</B> Object</A> </DD>

<DT><I>Message</I></DT>

<DD>The text string to write to the log file.  
</DD>
</DL>

<H4>C++</H4>

<P>See <A HREF="merg_9cq6.htm"><B>Log Function</B></A>.</P>
