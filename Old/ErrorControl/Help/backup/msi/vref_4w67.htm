<H1><A NAME="_msi_language_property_session_object_"></A>Language Property (Session Object)</H1>

<P>The Language property of the <A HREF="vref_8xis.htm"><B>Session</B> object</A> is a read-only property that represents the numeric language ID used by the current install session.</P>

<H4>Syntax</H4>

<P><I>object</I>.Language</P>

<H4>Parts</H4>

<DL>
<DT><I>object</I></DT>

<DD><A HREF="vref_8xis.htm"><B>Session</B> object</A>
</DD>
</DL>
