<H1><A NAME="_msi_targetdir_property"></A>TARGETDIR Property</H1>

<P>TARGETDIR must be the name of one root in the <A HREF="tref_6an9.htm">Directory</A> table. It is used as the location to copy the Installer installation package during an <A HREF="over_6jzi.htm">administrative installation</A>.</P>
